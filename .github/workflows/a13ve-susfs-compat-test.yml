name: A13VE SUSFS 1.5.5 kernel-4.19 compatibility test

on:
  workflow_dispatch:
  push:
    branches:
      - a13ve-ksun-legacy-fix

permissions:
  contents: read

jobs:
  susfs-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          ref: a13ve-ksun-legacy-fix

      - name: Install patch tools
        run: sudo apt-get update && sudo apt-get install -y git patch

      - name: Checkout exact A13VE kernel source
        run: |
          git clone --depth=1 --branch legion-mt6768 https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git kernel
          test "$(sed -nE 's/^VERSION = ([0-9]+)$/\1/p' kernel/Makefile | head -1)" = "4"

      - name: Fetch official SUSFS kernel-4.19 branch
        run: |
          git clone --depth=1 --branch kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          grep -q 'SUSFS_VERSION "v1.5.5"' susfs4ksu/kernel_patches/include/linux/susfs.h
          test -s susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          echo "Confirmed official non-GKI SUSFS v1.5.5 sources and kernel-4.19 patch."

      - name: Verify SukiSU Nova builtin SUSFS integration
        run: |
          git clone --depth=1 --branch builtin https://github.com/SukiSU-Nova/SukiSU-Nova.git sukisu
          grep -q '^config KSU_SUSFS$' sukisu/kernel/Kconfig
          grep -q '^config KPM$' sukisu/kernel/Kconfig
          echo "SukiSU Nova builtin declares SUSFS and KPM Kconfig options."

      - name: Test exact SUSFS kernel patch application
        run: |
          cd kernel
          cp ../susfs4ksu/kernel_patches/fs/*.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/*.h include/linux/
          git apply --check ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          git apply ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          grep -q 'SUSFS_VERSION "v1.5.5"' include/linux/susfs.h
          grep -q 'susfs.o' fs/Makefile
          echo "EXACT_KERNEL_PATCH=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "SUSFS_VERSION=v1.5.5" >> "$GITHUB_STEP_SUMMARY"
